---
layout: base
title: Posts
---

<h1>Posts</h1>

{% assign sorted = collections.post | reverse %}
<ul class="post-list">
  {% for post in sorted %}
  <li>
    <a href="{{ post.url }}">{{ post.data.title }}</a>
    <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%B %d, %Y" }}</time>
  </li>
  {% endfor %}
</ul>
