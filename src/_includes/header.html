<header>
  <nav>
    <a href="/" class="site-title">
      {{ site.name }}
    </a>
    <ul>
      {% for item in nav %}
        <li><a href="{{ item.url }}"
          {% if page.url == item.url or item.url != "/" and page.url contains item.url %}aria-current="page"{% endif %}>
          {{ item.label }}</a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</header>
